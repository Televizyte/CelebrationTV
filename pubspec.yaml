name: celebration_tv
description: Celebration TV (Flutter) - API 35 ready with AdMob + Remote Config
publish_to: "none"
version: 3.45.0+14

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0
  google_mobile_ads: ^5.1.0
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.2
  firebase_remote_config: ^5.1.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/bible/
